name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest
          if [ -f pyproject.toml ]; then python -m pip install -e ".[dev]" || true; fi

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: |
          if [ -d tests ] && ls tests/test_*.py >/dev/null 2>&1; then
            pytest -q
          else
            echo "No tests yet — skipping (CI will enforce tests once code lands)."
          fi
