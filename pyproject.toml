[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roshd"
version = "0.1.0"
description = "Roshd Wind Pathfinder - Wind data preprocessing and pathfinding pipeline"
authors = [
    {name = "Arman Ahmadi", email = "lawbr3aker@proton.me"},
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["data*", "preprocessing*", "pathfinding*", "qc*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=append"
